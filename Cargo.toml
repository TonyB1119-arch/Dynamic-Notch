[package]
name = "dynamic-notch"
version = "3.0.1"
edition = "2021"
description = "A MacBook-style dynamic notch / desktop island for Windows"
license = "MIT"
repository = "https://github.com/eigenes/DynamicNotch"
homepage = "https://eigenes.github.io/DynamicNotch/"
readme = "README.md"
keywords = ["windows", "notch", "dynamic-island", "desktop", "widget"]
categories = ["gui"]
publish = false

[[bin]]
name = "dynamic-notch"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
windows-numerics = "0.3"
windows-future = "0.3"
windows-core = "0.62"
windows-collections = "0.3"

[dependencies.windows]
version = "0.62"
features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Bluetooth_Rfcomm",
    "Devices_Enumeration",
    "Devices_Radios",
    "Devices_WiFi",
    "Foundation",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Graphics",
    "Graphics_DirectX",
    "Graphics_Imaging",
    "Media_Capture",
    "Media_Capture_Frames",
    "Media_Control",
    "Media_MediaProperties",
    "Networking_Connectivity",
    "Security_Credentials",
    "Storage_Streams",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "UI_Notifications",
    "UI_Notifications_Management",
    "ApplicationModel",
    "Win32_Devices_Bluetooth",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_Wmi",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The generated Windows bindings are huge but need no heavy optimising (the code that uses
# them is optimised when it is linked in). Building them in small pieces keeps the memory
# use low enough that small build machines do not kill the compiler.
[profile.release.package.windows]
opt-level = 1
codegen-units = 16

# Quick test builds: `cargo build --profile fast` compiles in a fraction of the time and
# memory of a release build; the app runs a little slower. Use `--release` for the real one.
[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true
strip = false

[profile.dev]
opt-level = 1
